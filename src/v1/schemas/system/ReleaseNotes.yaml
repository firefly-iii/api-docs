ReleaseNotes:
  type: object
  properties:
    version:
      type: string
      format: string
      example: "%version%"
    release_notes:
      nullable: true
      type: string
      format: string
      description: The release notes as HTML.
    release_notes_markdown:
      nullable: true
      type: string
      format: string
      description: The release notes in Markdown format.
