/data/destroy:
  delete:
    tags:
      - data
    operationId: destroyData
    summary: Endpoint to destroy user data
    description: |
      A call to this endpoint deletes the requested data type. Use it with care and always with user permission.
      The demo user is incapable of using this endpoint.
    responses:
      _tpl_unauthenticatedResponse,3:
      _tpl_notFoundResponse,3:
      _tpl_badRequestResponse,3:
      _tpl_internalExceptionResponse,3:
      "204":
        description: Empty response when data has been destroyed.
    parameters:
      _tpl_correlationParameter,3:
      - in: query
        name: objects
        description: The type of data that you wish to destroy. You can only use one at a time.
        required: true
        schema:
          $ref: '#/components/schemas/DataDestroyObject'
      - in: query
        name: unused
        description: |
          Only applies when "objects" is set to: not_assets_liabilities, accounts, asset_accounts, expense_accounts, revenue_accounts or liabilities.
          
          If set to true, only unused accounts will be destroyed. This effectively cleans up the autocomplete dropdowns.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: integer
            format: int64
          example: [ 1, 2, 3 ]